# Scenario B - srsUE 5G SA, radio ZeroMQ (Phase 5).
# Lancement : srsue /config/ue_zmq.conf

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
# L'UE emet (bind) sur 10.20.11.20:2001 et recoit du gNB 10.20.11.10:2000.
device_args = tx_port=tcp://10.20.11.20:2001,rx_port=tcp://10.20.11.10:2000,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 52
nof_prb = 52

[pcap]
enable = none

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
# L'interface tun_srsue est creee dans le namespace reseau ue1 du conteneur.
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
